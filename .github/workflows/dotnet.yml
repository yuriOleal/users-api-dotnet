name: .NET build and tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore Api.Tests/Api.Tests.csproj
      - name: Build
        run: dotnet build Api.Tests/Api.Tests.csproj --no-restore --configuration Release
      - name: Test
        run: dotnet test Api.Tests/Api.Tests.csproj --no-build --configuration Release --verbosity normal
